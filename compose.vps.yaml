# Ghostel on the shared VPS (host network, like the other apps on this machine):
#   Backend (Node)    127.0.0.1:8108  (web build + API + WebSocket; only the frontend proxy reaches it)
#   Frontend (nginx)  0.0.0.0:8109    (public entry for Cloudflare Tunnel; proxies everything to 8108)
#   PostgreSQL        existing server on 127.0.0.1:8100, own role "ghostel" and database "ghostel"
# Usage: cp .env.vps.example .env.vps (fill it in, chmod 600), then
#        docker compose -f compose.vps.yaml --env-file .env.vps up -d --build
# The Docker bridge network on this machine is broken, so builds and containers use the host network.
name: ghostel-prod
services:
  app:
    build:
      context: .
      network: host
    image: ghostel-prod-app
    restart: unless-stopped
    network_mode: host
    environment:
      NODE_ENV: production
      HOST: 127.0.0.1
      PORT: "8108"
      DATABASE_URL: postgres://ghostel:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@127.0.0.1:8100/ghostel
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:?set ALLOWED_ORIGINS to the exact public https origin}
      TRUST_PROXY: "1"
      VOICE_ICE_SERVERS: ${VOICE_ICE_SERVERS:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8108/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    init: true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: nginx:1.29-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
