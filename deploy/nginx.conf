# Public entry on :8109 (Cloudflare Tunnel points here). Everything, including the WebSocket on /ws,
# is proxied to the Node server on 127.0.0.1:8108, which serves the web build and sets the security
# headers (CSP, cookies, cache), so they are defined in one place only.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ""      close;
}

server {
  listen 8109;
  server_tokens off;
  # Slides upload limit is 10 MB (SLIDES_MAX_BYTES); the server enforces the exact limit.
  client_max_body_size 11m;

  # The visitor's address: Cloudflare sends it in CF-Connecting-IP, but trust that header only from a
  # tunnel connector on this machine. Direct visitors cannot fake it.
  set_real_ip_from 127.0.0.1;
  set_real_ip_from ::1;
  real_ip_header CF-Connecting-IP;

  location ~ /\. { return 404; }

  location / {
    proxy_pass http://127.0.0.1:8108;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite, never append: the server trusts exactly one proxy hop (TRUST_PROXY=1).
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }
}
