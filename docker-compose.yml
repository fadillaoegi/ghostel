name: ghostel

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ghostel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ghostel_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-ghostel}
    ports:
      - "127.0.0.1:5490:5432"
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker, so the volume is mounted at
      # /var/lib/postgresql (not .../data as in 17 and older).
      - ghostel_pg18:/var/lib/postgresql
      - ./infra/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  ghostel_pg18:
